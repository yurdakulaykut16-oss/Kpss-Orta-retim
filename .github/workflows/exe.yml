# KPSS_Kamp.exe'yi Windows'ta derler, açılıp çalıştığını test eder ve depoya ekler.
# Elle çalıştırma: GitHub → Actions → "KPSS_Kamp.exe (Windows)" → Run workflow
name: KPSS_Kamp.exe (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - app.py
      - kpss_kamp.py
      - kpss_kapsam.py
      - calisma_hedefi.py
      - KPSS_Kamp.spec
      - requirements.txt
      - static/**
      - data/sorular/**
      - data/dersler/**
      - data/*.json
      - .github/workflows/exe.yml

permissions:
  contents: write

concurrency:
  group: exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Paketler
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Exe derle
        run: python -m PyInstaller --noconfirm --clean KPSS_Kamp.spec

      - name: Exe duman testi (açılıyor mu, 7 günlük program ve 3 hocalı anlatımlar geliyor mu?)
        shell: pwsh
        run: |
          $env:KPSS_PORT = "5077"
          $p = Start-Process -FilePath "dist\KPSS_Kamp.exe" -ArgumentList "--tarayici-acma" -PassThru `
                 -RedirectStandardOutput "exe_cikti.txt" -RedirectStandardError "exe_hata.txt"
          $m = $null
          try {
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 2
              if ($p.HasExited) { throw "KPSS_Kamp.exe kapandı (çıkış kodu $($p.ExitCode))" }
              try { $m = (Invoke-WebRequest "http://127.0.0.1:5077/api/meta" -UseBasicParsing).Content | ConvertFrom-Json -AsHashtable; if ($m.sinav) { break } } catch {}
            }
            if (-not $m -or -not $m.sinav) { throw "KPSS_Kamp.exe 180 sn içinde yanıt vermedi" }
            $html = Invoke-WebRequest "http://127.0.0.1:5077/" -UseBasicParsing
            if ($html.StatusCode -ne 200) { throw "Ana sayfa açılmadı" }
            # Konu anahtarlarında yalnız büyük/küçük harfle ayrılanlar var (Paragraf/paragraf) → hashtable ile oku.
            $k = (Invoke-WebRequest "http://127.0.0.1:5077/api/konu-yeniden" -UseBasicParsing).Content | ConvertFrom-Json -AsHashtable
            $gun = @($m.gun_ozetleri).Count
            Write-Host "Program günü: $gun | konu kartı: $($k.Count)"
            if ($gun -ne 7) { throw "Program 7 gün değil ($gun)" }
            if ($k.Count -lt 100) { throw "Konu kartları eksik ($($k.Count))" }
            if (-not (Test-Path "dist\KPSS_Kamp_ilerleme")) { throw "İlerleme klasörü exe'nin yanında oluşmadı" }
          } catch {
            $cikti = (Get-Content exe_cikti.txt -Raw -ErrorAction SilentlyContinue) -replace "`r?`n", " | "
            $hata = (Get-Content exe_hata.txt -Raw -ErrorAction SilentlyContinue) -replace "`r?`n", " | "
            Write-Host "::error title=Exe duman testi::$($_.Exception.Message)"
            Write-Host "::error title=Exe stdout::$cikti"
            Write-Host "::error title=Exe stderr::$($hata.Substring(0, [Math]::Min(3000, $hata.Length)))"
            throw
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: KPSS_Kamp-exe
          path: dist/KPSS_Kamp.exe
          retention-days: 30

      - name: Exe'yi depoya ekle (KPSS_Kamp.exe)
        shell: bash
        run: |
          cp dist/KPSS_Kamp.exe KPSS_Kamp.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KPSS_Kamp.exe
          if git diff --cached --quiet; then echo "Exe değişmedi"; exit 0; fi
          git commit -m "KPSS_Kamp.exe güncellendi (otomatik Windows derlemesi) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
